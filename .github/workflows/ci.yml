name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Unit tests (PC)
        run: pio test -e native

      - name: Build for the ESP32
        run: |
          cp src/secrets.h.example src/secrets.h
          set -o pipefail
          if ! pio run -e esp32dev 2>&1 | tee build.log; then
            # Show the first errors as annotations on the pull request
            grep -E "error|Error|undefined reference" build.log | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
