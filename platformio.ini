; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Platform pinned: 6.9.0 brings the Arduino core 2.0.17 (ESP-IDF 4.4), for which
; this code was written. Without a version, PlatformIO takes the latest platform
; (Arduino core 3.x, ESP-IDF 5), where the legacy RMT driver is deprecated.
; The move to the new RMT driver is planned in step 2 of the roadmap.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
build_flags = -DCORE_DEBUG_LEVEL=5
monitor_speed = 115200
lib_deps = 
	arduino-libraries/Ethernet@^2.0.2
debug_tool = esp-prog
debug_init_break = tbreak setup
